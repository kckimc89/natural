<div class="sub">우리 주변에서 만나는 꽃·나무·곤충·새를 발견하고 모아 보는 나만의 자연도감</div>

function $(id){return document.getElementById(id)}
const starter=[
['민들레','꽃','🌼','봄·여름','햇볕이 잘 드는 길가와 잔디밭에서 흔히 볼 수 있는 노란 꽃이에요.','노란 꽃이 둥글게 모여 피고, 꽃이 진 뒤에는 하얀 솜털 씨앗이 생겨요.','씨앗이 바람을 타고 멀리 이동할 수 있어요.','꽃이 진 뒤 씨앗의 모양도 관찰해 보세요.'],
['벚꽃','꽃','🌸','봄','봄이 되면 나무 가득 연분홍색과 흰색 꽃이 피어나는 대표적인 봄꽃이에요.','꽃잎이 5장인 작은 꽃들이 여러 송이 모여 피어요.','우리나라 여러 지역의 공원과 길에서 볼 수 있어요.','꽃잎이 떨어진 뒤 잎이 어떻게 나오는지도 살펴보세요.'],
['해바라기','꽃','🌻','여름·가을','커다란 노란 꽃이 햇빛을 받으며 피는 식물이에요.','꽃 가운데에는 아주 많은 작은 꽃이 모여 있고 바깥쪽에는 노란 꽃잎이 있어요.','씨앗은 사람이 먹기도 하고 기름을 만들기도 해요.','꽃의 가운데와 가장자리의 모양을 비교해 보세요.'],
['장미','꽃','🌹','봄·여름·가을','향기와 아름다운 꽃으로 사랑받는 대표적인 꽃이에요.','색이 매우 다양하고 줄기에 가시가 있는 종류가 많아요.','정원이나 공원에서 여러 색의 장미를 볼 수 있어요.','가시에 손이 다치지 않도록 눈으로 관찰하세요.'],
['나팔꽃','꽃','🪻','여름·가을','아침에 나팔 모양의 꽃이 활짝 피는 덩굴식물이에요.','줄기가 다른 물체를 감으며 자라고 꽃은 나팔처럼 생겼어요.','꽃이 피는 시간과 지는 시간을 비교해 보면 재미있어요.','아침과 오후의 꽃 모양을 비교해 보세요.'],
['단풍나무','나무','🍁','봄·여름·가을','가을에 잎이 빨강·주황·노랑으로 물드는 나무예요.','잎이 손바닥처럼 갈라져 있는 모양이 특징이에요.','가을에는 잎 색깔이 달라지는 과정을 관찰할 수 있어요.','같은 나무에서 색이 다른 잎을 찾아보세요.'],
['소나무','나무','🌲','사계절','우리 주변에서 흔히 볼 수 있는 늘푸른 나무예요.','바늘처럼 생긴 잎이 여러 개씩 모여 달리고 솔방울이 열려요.','잎이 겨울에도 푸른 상태로 남아 있어요.','솔방울과 잎의 길이를 눈으로 비교해 보세요.'],
['은행나무','나무','🌳','봄·여름·가을','부채처럼 생긴 잎과 노랗게 물드는 가을 모습으로 유명한 나무예요.','잎 가운데에서 여러 갈래로 퍼지는 선이 보여요.','가을에 노란 잎이 많이 떨어져 길을 덮기도 해요.','잎을 주워 모양을 관찰하고 만져 보세요.'],
['느티나무','나무','🌳','사계절','공원과 학교에서 큰 그늘을 만들어 주는 친숙한 나무예요.','나뭇가지가 넓게 퍼지고 잎 가장자리에 작은 톱니가 있어요.','오래된 느티나무는 아주 큰 나무로 자랄 수 있어요.','나무 아래와 밖의 온도를 느낌으로 비교해 보세요.'],
['단풍나무','나무','🍁','봄·여름·가을','손바닥처럼 갈라진 잎을 가진 나무로 가을 단풍이 아름다워요.','잎의 갈라진 부분이 여러 갈래로 나뉘어 있어요.','종류에 따라 잎 모양과 단풍 색이 조금씩 달라요.','주변에서 비슷한 잎을 찾아 비교해 보세요.'],
['무당벌레','곤충','🐞','봄·여름·가을','작고 둥근 몸에 점무늬가 있는 귀여운 곤충이에요.','딱딱한 앞날개 아래에 얇은 날개가 숨어 있어요.','진딧물 같은 작은 곤충을 먹는 종류가 있어 식물에 도움을 주기도 해요.','손으로 잡지 말고 움직이는 모습을 관찰해 보세요.'],
['나비','곤충','🦋','봄·여름','알→애벌레→번데기→어른벌레로 모습이 크게 달라지는 곤충이에요.','날개에 비늘가루가 있고 종류마다 무늬가 달라요.','꽃의 꿀을 먹으며 꽃가루받이에 도움을 줄 수 있어요.','날개 무늬와 색을 자세히 살펴보세요.'],
['꿀벌','곤충','🐝','봄·여름·가을','꽃을 찾아다니며 꿀과 꽃가루를 모으는 곤충이에요.','몸에 노란색과 검은색 줄무늬가 있고 여러 마리가 함께 생활해요.','꽃가루를 옮겨 식물이 열매를 맺는 데 도움을 줘요.','벌을 만지지 말고 멀리서 꽃을 오가는 모습을 보세요.'],
['잠자리','곤충','🪰','여름·가을','길고 가느다란 몸과 투명한 날개가 특징인 곤충이에요.','두 쌍의 날개가 있고 눈이 매우 커 보여요.','물가에서 어린 시절을 보내는 종류가 많아요.','날개가 움직이는 방향과 날아가는 속도를 관찰해 보세요.'],
['개미','곤충','🐜','봄·여름·가을','작지만 무리를 지어 생활하는 대표적인 곤충이에요.','머리·가슴·배가 구분되고 더듬이를 사용해 주변을 살펴요.','종류에 따라 먹이와 생활 방식이 달라요.','개미가 어디로 이동하는지 길을 따라가 보세요.'],
['참새','새','🐦','사계절','우리 주변에서 쉽게 만날 수 있는 작은 새예요.','갈색과 회색빛 깃털을 가지고 있으며 땅과 나무 주변을 오가요.','도시와 농촌 모두에서 볼 수 있어요.','참새가 땅에서 무엇을 찾는지 관찰해 보세요.'],
['까치','새','🐦','사계절','검정색과 흰색 깃털이 눈에 띄는 친숙한 새예요.','긴 꼬리와 검정·흰색 깃털이 특징이에요.','우리나라에서 흔히 볼 수 있는 새 가운데 하나예요.','울음소리를 듣고 어느 방향에서 들리는지 찾아보세요.'],
['비둘기','새','🕊️','사계절','도시의 공원이나 광장에서 자주 볼 수 있는 새예요.','회색 몸과 목의 빛나는 색이 특징인 종류가 많아요.','사람이 사는 곳 주변에 잘 적응해 살아가요.','걸을 때 머리가 어떻게 움직이는지 관찰해 보세요.'],
['제비','새','🐦','봄·여름','따뜻한 계절에 우리나라를 찾아오는 철새예요.','날개가 길고 뾰족하며 꼬리가 갈라져 있어요.','곤충을 잡아먹으며 빠르게 날아다녀요.','하늘을 낮게 날아다니는 모습을 찾아보세요.'],
['오리','새','🦆','사계절','물가에서 헤엄치며 생활하는 친숙한 새예요.','물갈퀴가 있는 발로 물을 잘 헤엄쳐요.','종류에 따라 부리와 깃털 색이 다양해요.','물 위에서 헤엄치는 방향을 관찰해 보세요.'],
['참나무','나무','🌳','사계절','도토리를 만드는 나무를 통틀어 부르는 이름이에요.','잎 모양과 도토리 모양이 종류에 따라 달라요.','도토리는 여러 동물의 먹이가 되기도 해요.','바닥에서 도토리와 잎을 찾아 비교해 보세요.'],

const SUBCATS={꽃:['전체','봄꽃','여름꽃','가을꽃','들꽃','정원꽃'],나무:['전체','늘푸른나무','낙엽나무','가로수','열매·씨앗'],곤충:['전체','나비·나방','딱정벌레','벌·개미','잠자리','기타 곤충'],새:['전체','텃새','철새','물새','도시의 새']};
const CAT_SUB={
'민들레':'들꽃','벚꽃':'봄꽃','해바라기':'여름꽃','장미':'정원꽃','나팔꽃':'여름꽃','목련':'봄꽃','코스모스':'가을꽃','토끼풀':'들꽃','제비꽃':'봄꽃','진달래':'봄꽃','개나리':'봄꽃',

'무당벌레':'딱정벌레','나비':'나비·나방','호랑나비':'나비·나방','꿀벌':'벌·개미','잠자리':'잠자리','개미':'벌·개미','사마귀':'기타 곤충','귀뚜라미':'기타 곤충','딱정벌레':'딱정벌레',
'참새':'텃새','까치':'텃새','비둘기':'도시의 새','제비':'철새','오리':'물새','직박구리':'텃새'
};
function defaultPhotoUrl(name){const file=PHOTO_FILES[name];return file?'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(file)+'?width=520':''}
function makeStarter(){return starter.map((x,i)=>({id:'s'+i,name:x[0],cat:x[1],art:x[2],season:x[3],desc:x[4],feature:x[5],fact:x[6],observe:x[7],photo:'',defaultPhoto:defaultPhotoUrl(x[0]),subcat:CAT_SUB[x[0]]||'기타',favorite:false,place:'',memo:''}))}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}if(!Array.isArray(data))data=[];const existing=new Set(data.map(x=>x.name));makeStarter().forEach(x=>{if(!existing.has(x.name))data.push(x)});data.forEach(f=>{if(!f.subcat)f.subcat=CAT_SUB[f.name]||'기타';if(!f.defaultPhoto)f.defaultPhoto=defaultPhotoUrl(f.name)});save()}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setCat(c){category=c;if(!['꽃','나무','곤충','새'].includes(c))window.currentSubcat='전체';render();window.scrollTo({top:0,behavior:'smooth'})}
function bookName(c){return c==='꽃'?'🌸 꽃도감':c==='나무'?'🌳 나무도감':c==='곤충'?'🐞 곤충도감':c==='새'?'🐦 새도감':'🌿 자연도감'}
function render(){
 const q=($('search').value||'').trim().toLowerCase();
 const activeBook=['꽃','나무','곤충','새'].includes(category)?category:null;
 $('bookHead').innerHTML=activeBook?`<div class="bookHead"><h2>${bookName(activeBook)}</h2><button class="back" onclick="setCat('전체')">← 4개 도감</button></div>`:`<div class="bookHead"><h2>🌿 어린이 자연도감</h2></div>`;
 let sub='전체';
 if(activeBook){
   const currentSub=window.currentSubcat||'전체';
   sub=SUBCATS[activeBook].includes(currentSub)?currentSub:'전체';
   window.currentSubcat=sub;
   $('filters').innerHTML=SUBCATS[activeBook].map(c=>`<button class="chip ${sub===c?'on':''}" onclick="setSubCat('${c}')">${c}</button>`).join('');
 }else{
   $('filters').innerHTML='';
 }
 let list=category==='전체'?data:category==='__FAV__'?data.filter(x=>x.favorite):data.filter(x=>x.cat===category);
 if(activeBook&&sub!=='전체')list=list.filter(x=>(x.subcat||CAT_SUB[x.name]||'기타')===sub);
 if(q)list=list.filter(x=>[x.name,x.cat,x.season,x.subcat,x.desc,x.feature,x.fact,x.observe,x.place,x.memo].some(v=>String(v||'').toLowerCase().includes(q)));
 $('grid').innerHTML=list.length?list.map(card).join(''):`<div class="empty">아직 등록된 자연이 없어요.<br>새로운 자연을 발견해 볼까요? 🌱</div>`;
 ['꽃','나무','곤충','새'].forEach(c=>$('count-'+c).textContent=`${data.filter(x=>x.cat===c).length}종`);
 $('parentState').innerHTML=parentMode?'<span class="parentOn">🔓 부모님 모드 켜짐</span>':'';
 list.forEach(loadPhoto);
}
function setSubCat(c){window.currentSubcat=c;render()}
function card(f){const hasDefault=!!f.defaultPhoto;return `<div class="card" onclick="detail('${esc(f.id)}')"><button class="fav" onclick="event.stopPropagation();toggleFav('${esc(f.id)}')">${f.favorite?'⭐':'☆'}</button><div class="pic ${hasDefault?'defaultPhoto':''}" id="pic-${esc(f.id)}">${hasDefault?`<img loading="lazy" src="${esc(f.defaultPhoto)}" alt="${esc(f.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}<div class="natureArt" style="${hasDefault?'display:none':''}">${f.art||iconFor(f.cat)}<small>${f.photo?'내 사진을 불러오는 중…':'사진을 등록해 보세요'}</small></div></div><div class="ct"><div class="name">${esc(f.name)}</div><div class="meta">${esc(f.cat)} · ${esc(f.season||'사계절')}${f.subcat?` · ${esc(f.subcat)}`:''}</div>${f.photo?'<span class="badge">📷 내 사진</span>':''}</div></div>`}
function iconFor(c){return c==='꽃'?'🌸':c==='나무'?'🌳':c==='곤충'?'🐞':'🐦'}
function toggleFav(id){const f=data.find(x=>x.id===id);if(!f)return;f.favorite=!f.favorite;save();render()}
async function loadPhoto(f){if(!f.photo)return;try{const src=await getPhoto(f.id);const el=$('pic-'+f.id);if(el&&src)el.innerHTML=`<img loading="lazy" src="${src}" alt="${esc(f.name)}">`}catch(e){}}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){stopCamera();$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()})
function detail(id){const f=data.find(x=>x.id===id);if(!f)return;getPhoto(f.id).then(src=>{const photo=src||f.defaultPhoto;openModal(`<div class="detailHero">${photo?`<img class="detailPhoto" src="${esc(photo)}" alt="${esc(f.name)}">`:`<div class="detailArt">${f.art||iconFor(f.cat)}</div>`}</div><div class="detailTitle">${esc(f.name)}</div><div class="detailSub">${esc(f.cat)} · ${esc(f.season||'사계절')}</div>${f.defaultPhoto&&!f.photo?'<div class="photoCredit">기본 사진: Wikimedia Commons · 화면에 맞는 작은 크기로 불러옵니다.</div>':''}<div class="section"><h3>🌿 어떤 자연일까요?</h3>${esc(f.desc||'아직 설명이 없어요.')}</div><div class="section"><h3>👀 생김새와 특징</h3>${esc(f.feature||'주변에서 자세히 관찰해 보세요.')}</div><div class="fact"><b>💡 재미있는 이야기</b><br>${esc(f.fact||'자연에는 재미있는 비밀이 많아요.')}</div><div class="section"><h3>🔎 관찰해 보기</h3>${esc(f.observe||'만지지 않고 눈으로 천천히 관찰해 보세요.')}</div>${f.place||f.memo?`<div class="section"><h3>📝 내가 발견한 기록</h3>${f.place?`📍 발견한 곳: ${esc(f.place)}<br>`:''}${f.memo?`✏️ 메모: ${esc(f.memo)}`:''}</div>`:''}<div class="mission">🌱 <b>자연 탐험 약속</b><br>꽃·나무·곤충·새는 가능한 한 손으로 잡거나 꺾지 말고 눈과 카메라로 관찰해요.</div><div class="actions"><button onclick="photoFor('${esc(f.id)}')">📷 ${f.photo?'사진 바꾸기':'사진 등록'}</button><button onclick="toggleFav('${esc(f.id)}');closeModal()">${f.favorite?'⭐ 좋아요 취소':'⭐ 좋아요'}</button>${parentMode?`<button onclick="editItem('${esc(f.id)}')">✏️ 부모님 설명 수정</button><button class="danger" onclick="deleteItem('${esc(f.id)}')">🗑️ 삭제</button>`:''}<button class="alt wide" onclick="closeModal()">닫기</button></div>`)}).catch(()=>{})}
function toggleParent(){if(parentMode){parentMode=false;render();return}openModal(`<h2>🔒 부모님 모드</h2><p>도감 설명·카테고리·삭제 기능은 부모님 모드에서 사용할 수 있어요.</p><div class="field"><label>비밀번호</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="처음에는 0000"></div><div class="actions"><button onclick="unlock()">확인</button><button class="alt" onclick="closeModal()">취소</button></div>`)}
function unlock(){const pin=$('pin').value;if(pin==='0000'||pin===localStorage.getItem('kids_nature_pin')){parentMode=true;closeModal();render()}else alert('비밀번호가 맞지 않아요. 처음이라면 0000을 입력해 주세요.')}
function editItem(id){const f=data.find(x=>x.id===id);if(!f)return;openModal(`<h2>✏️ 부모님 설명 수정</h2><div class="field"><label>이름</label><input id="e_name" value="${esc(f.name)}"></div><div class="field"><label>분류</label><select id="e_cat"><option>꽃</option><option>나무</option><option>곤충</option><option>새</option></select></div><div class="field"><label>계절</label><input id="e_season" value="${esc(f.season||'')}"></div><div class="field"><label>어떤 자연일까요?</label><textarea id="e_desc">${esc(f.desc||'')}</textarea></div><div class="field"><label>생김새와 특징</label><textarea id="e_feature">${esc(f.feature||'')}</textarea></div><div class="field"><label>재미있는 이야기</label><textarea id="e_fact">${esc(f.fact||'')}</textarea></div><div class="field"><label>관찰해 보기</label><textarea id="e_observe">${esc(f.observe||'')}</textarea></div><div class="actions"><button onclick="saveEdit('${esc(f.id)}')">저장</button><button class="alt" onclick="detail('${esc(f.id)}')">취소</button></div>`);$('e_cat').value=f.cat}
function saveEdit(id){const f=data.find(x=>x.id===id);if(!f)return;f.name=$('e_name').value.trim()||f.name;f.cat=$('e_cat').value;f.subcat=CAT_SUB[f.name]||f.subcat||'기타';f.defaultPhoto=defaultPhotoUrl(f.name);f.season=$('e_season').value.trim();f.desc=$('e_desc').value.trim();f.feature=$('e_feature').value.trim();f.fact=$('e_fact').value.trim();f.observe=$('e_observe').value.trim();save();closeModal();render();detail(f.id)}
function deleteItem(id){if(!parentMode)return;const f=data.find(x=>x.id===id);if(!f)return;if(!confirm(`“${f.name}”을(를) 도감에서 바로 삭제할까요?`))return;data=data.filter(x=>x.id!==id);save();deletePhoto(id).finally(()=>{closeModal();render()})}
function openAdd(){openModal(`<h2>🔎 새로운 자연 발견</h2><p>아이가 직접 발견한 이름을 적어 도감에 넣어 보세요.</p><div class="field"><label>이름</label><input id="a_name" placeholder="예: 민들레, 잠자리, 참새"></div><div class="field"><label>분류</label><select id="a_cat"><option>꽃</option><option>나무</option><option>곤충</option><option>새</option></select></div><div class="field"><label>발견한 계절</label><input id="a_season" placeholder="예: 봄, 여름, 가을, 사계절"></div><div class="field"><label>어디에서 발견했나요?</label><input id="a_place" placeholder="예: 학교 운동장, 아파트 화단"></div><div class="field"><label>한마디 메모</label><textarea id="a_memo" placeholder="무엇이 재미있었나요?"></textarea></div><div class="actions"><button onclick="addNew()">🌱 도감에 등록</button><button class="alt" onclick="closeModal()">취소</button></div>`)}
function addNew(){const name=$('a_name').value.trim();if(!name){alert('이름을 먼저 입력해 주세요.');return}if(data.some(x=>x.name===name)){alert('이미 도감에 있는 자연이에요.');return}const cat=$('a_cat').value;const f={id:'u'+Date.now(),name,cat,season:$('a_season').value.trim()||'관찰 중',desc:`${name}에 대해 직접 관찰하며 알아가는 중이에요.`,feature:'사진을 찍고 생김새를 자세히 관찰해 보세요.',fact:'이 자연에 대해 궁금한 점을 부모님과 함께 찾아보세요.',observe:'만지거나 꺾지 않고 안전한 거리에서 관찰해 보세요.',art:iconFor(cat),photo:'',defaultPhoto:defaultPhotoUrl(name),subcat:'기타',favorite:false,place:$('a_place').value.trim(),memo:$('a_memo').value.trim()};data.push(f);save();closeModal();render();setTimeout(()=>detail(f.id),100)}
function photoFor(id){openModal(`<h2>📷 사진 등록</h2><div class="choiceGrid"><button class="choice" onclick="openCamera('${esc(id)}')">📸 카메라로 찍기</button><button class="choice" onclick="document.getElementById('fileInput').click()">🖼️ 사진 선택</button></div><input id="fileInput" type="file" accept="image/*" style="display:none" onchange="handleFile('${esc(id)}',this.files[0])"><p class="small">사진은 iPad 안에 저장되며, 이 자연도감의 사진 저장공간만 사용합니다.</p><button class="alt" style="width:100%" onclick="closeModal()">취소</button>`)}
async function openCamera(id){openModal(`<h2>📸 자연 사진 찍기</h2><div class="cameraBox"><video id="cameraVideo" autoplay playsinline></video></div><canvas id="cameraCanvas" style="display:none"></canvas><div class="actions"><button onclick="takePhoto('${esc(id)}')">📷 촬영</button><button class="alt" onclick="photoFor('${esc(id)}')">뒤로</button></div>`);try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('cameraVideo').srcObject=cameraStream}catch(e){alert('카메라를 사용할 수 없어요. iPad 설정에서 카메라 권한을 확인하거나 사진 선택을 이용해 주세요.')}}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
async function takePhoto(id){const v=$('cameraVideo'),c=$('cameraCanvas');if(!v||!v.videoWidth)return;let w=v.videoWidth,h=v.videoHeight,max=900;if(w>max){h=Math.round(h*max/w);w=max}c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));await storePhoto(id,blob);stopCamera();closeModal();render();setTimeout(()=>detail(id),100)}
async function handleFile(id,file){if(!file)return;try{const blob=await compress(file);await storePhoto(id,blob);closeModal();render();setTimeout(()=>detail(id),100)}catch(e){alert('사진 등록에 실패했어요. 다른 사진으로 다시 시도해 주세요.')}}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let s=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(), 'image/jpeg',.72)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function openPhotoDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storePhoto(id,blob){const db=await openPhotoDB();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});const f=data.find(x=>x.id===id);if(f){f.photo='idb:'+id;save()}}
async function getPhoto(id){const db=await openPhotoDB();return new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').get(id);r.onsuccess=()=>{if(!r.result){res('');return}res(URL.createObjectURL(r.result))};r.onerror=()=>rej(r.error)})}
async function deletePhoto(id){try{const db=await openPhotoDB();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
function openMission(){const missions=[['🌸 꽃 탐험','꽃 3종을 찾아 이름과 색을 관찰해 보세요.'],['🌳 나무 탐험','서로 다른 모양의 잎 2장을 찾아보세요.'],['🐞 곤충 탐험','곤충 2종을 찾아 움직임을 관찰해 보세요.'],['🐦 새 탐험','새 한 마리를 찾아 어디로 날아가는지 살펴보세요.']];const m=missions[new Date().getDate()%missions.length];openModal(`<h2>🎯 오늘의 자연 탐험</h2><div class="mission"><div style="font-size:28px">${m[0]}</div><p>${m[1]}</p><b>탐험 약속</b><br>자연을 꺾거나 잡지 않고 눈과 카메라로 관찰해요.</div><div class="actions"><button onclick="closeModal()">탐험하러 가기 🌿</button><button class="alt" onclick="closeModal()">닫기</button></div>`)}
function openBackup(){openModal(`<h2>💾 자연도감 백업</h2><p>도감 정보와 사진을 안전하게 보관할 수 있어요.</p><div class="actions"><button onclick="exportData()">⬇️ 백업 파일 만들기</button><button onclick="document.getElementById('restoreInput').click()">⬆️ 복원하기</button></div><input id="restoreInput" type="file" accept="application/json" style="display:none" onchange="restoreData(this.files[0])"><p class="small">사진까지 포함한 완전한 백업은 다음 버전에서 강화할 수 있습니다. 현재는 도감 정보와 내가 적은 기록을 안전하게 백업합니다.</p><button class="alt" style="width:100%" onclick="closeModal()">닫기</button>`)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='어린이자연도감_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.data))throw 0;const names=new Set(data.map(x=>x.name));o.data.forEach(x=>{if(!names.has(x.name)){data.push(x);names.add(x.name)}});save();closeModal();render();alert('복원이 완료되었습니다. 기존 도감은 삭제하지 않았어요.')}catch(e){alert('백업 파일을 읽을 수 없어요.')}};r.readAsText(file)}

 $('grid').innerHTML=activeBook||category==='__FAV__'?(list.length?list.map(card).join(''):`<div class="empty">아직 등록된 자연이 없어요.<br>새로운 자연을 발견해 볼까요? 🌱</div>`):`<div class="homeGuide"><div class="homeGuideTitle">🌱 도감을 하나 골라 보세요</div><p>꽃·나무·곤충·새는 서로 독립된 도감으로 관리됩니다.</p></div>`;

function openCategoryManager(){
 if(!parentMode)return;
 const cats=allCats();
 openModal(`<h2>🗂️ 카테고리 관리</h2><p>각 도감의 카테고리를 직접 만들고, 이름을 바꾸고, 순서를 바꾸거나 삭제할 수 있어요.</p><div id="catManager"></div><button class="alt" style="width:100%;margin-top:10px" onclick="closeModal()">닫기</button>`);

function renderCategoryManager(cats){
 const el=$('catManager');if(!el)return;
 el.innerHTML=Object.keys(cats).map(book=>`<div class="catMgrBook"><h3>${bookName(book)}</h3>${cats[book].map((c,i)=>`<div class="catRow"><span>${c}</span><div><button onclick="renameCategory('${book}','${escAttr(c)}')">✏️</button>${c!=='전체'?`<button onclick="moveCategory('${book}',${i},-1)">↑</button><button onclick="moveCategory('${book}',${i},1)">↓</button><button onclick="deleteCategory('${book}','${escAttr(c)}')">🗑️</button>`:''}</div></div>`).join('')}<button class="addCatBtn" onclick="addCategory('${book}')">＋ ${book} 카테고리 추가</button></div>`).join('');
}
function addCategory(book){const name=prompt(`${book}도감에 추가할 카테고리 이름을 입력하세요.`)?.trim();if(!name)return;const cats=allCats();if(cats[book].some(x=>x===name)){alert('이미 같은 이름의 카테고리가 있어요.');return}cats[book].push(name);saveCats(cats);renderCategoryManager(cats);render()}
function renameCategory(book,old){const name=prompt(`“${old}”을 새 이름으로 바꿔 주세요.`,old)?.trim();if(!name||name===old)return;const cats=allCats();if(cats[book].some(x=>x===name)){alert('이미 같은 이름의 카테고리가 있어요.');return}const i=cats[book].indexOf(old);if(i<0)return;cats[book][i]=name;data.forEach(f=>{if(f.cat===book&&f.subcat===old)f.subcat=name});saveCats(cats);save();renderCategoryManager(cats);render()}
function deleteCategory(book,name){if(name==='전체')return;const cats=allCats();if(cats[book].length<=2){alert('최소 하나의 분류 카테고리는 남겨 주세요.');return}if(!confirm(`“${name}” 카테고리를 삭제할까요? 이 카테고리의 자연은 “전체”로 이동합니다.`))return;data.forEach(f=>{if(f.cat===book&&f.subcat===name)f.subcat='전체'});cats[book]=cats[book].filter(x=>x!==name);saveCats(cats);save();if(window.currentSubcat===name)window.currentSubcat='전체';renderCategoryManager(cats);render()}
function moveCategory(book,index,delta){const cats=allCats();const j=index+delta;if(j<1||j>=cats[book].length)return;[cats[book][index],cats[book][j]]=[cats[book][j],cats[book][index]];saveCats(cats);renderCategoryManager(cats);render()}

function seedExtra(){
 const existing=new Set(data.map(x=>normalizeName(x.name)));
 EXTRA_DATA.forEach((x,i)=>{const n=normalizeName(x[0]);if(existing.has(n))return;const cat=x[1];data.push({id:'e'+i+'_'+Date.now(),name:x[0],searchName:x[0],aliases:'',cat,art:iconFor(cat),season:x[2],region:x[3],desc:x[4],feature:x[5],fact:x[6],observe:x[7],photo:'',defaultPhoto:defaultPhotoUrl(x[0]),subcat:x[8],favorite:false,place:'',memo:''});existing.add(n)});
 // 이름이 불확실한 기본사진은 억지로 연결하지 않습니다.
 const butterfly=data.find(x=>x.name==='나비');if(butterfly)butterfly.defaultPhoto='';
 save();
}
seedExtra();
render();


function updateDiscoverySuggestions(){
 const box=$('suggestList');if(!box)return;
 const cat=$('a_cat')?.value||'꽃', season=$('a_season')?.value||'', region=$('a_region')?.value||'';
 let list=data.filter(x=>x.cat===cat);
 if(season)list=list.filter(x=>String(x.season||'').includes(season)||x.season==='사계절');
 if(region)list=list.filter(x=>!x.region||x.region.includes(region)||region.includes('우리 동네'));
 list=list.filter(x=>!data.some(y=>y.id!==x.id&&normalizeName(y.name)===normalizeName(x.name))).slice(0,12);
 const built=(BUILTIN_NAMES[cat]||[]).filter(n=>!data.some(x=>normalizeName(x.name)===normalizeName(n))).slice(0,12);
 const names=[...new Set([...list.map(x=>x.name),...built])].slice(0,12);
 box.innerHTML=`<div class="suggestTitle">💡 ${season||region?`선택한 조건에 어울리는`:''} 추천 이름</div>${names.length?names.map(n=>`<button class="suggestBtn" onclick="chooseSuggested('${escAttr(n)}')">${esc(n)}</button>`).join(''):'<span class="small">조건에 맞는 새 이름을 직접 입력해 보세요.</span>'}`;
}
